name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Node ${{ matrix.node }} checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test

  integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: tuddofs
          POSTGRES_PASSWORD: tuddofs
          POSTGRES_DB: tuddofs_it
        options: >-
          --health-cmd "pg_isready -U tuddofs -d tuddofs_it"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TUDDOFS_DATABASE_URL: postgresql://tuddofs:tuddofs@127.0.0.1:5432/tuddofs_it
      TUDDOFS_MINIO_STREAM_BYTES: '268435456'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: PostgreSQL integration tests
        run: npm run test:integration
      - name: MinIO streaming acceptance smoke test
        run: npm run test:minio

  package:
    name: Packed package smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Pack
        id: pack
        run: |
          filename="$(npm pack --pack-destination "$RUNNER_TEMP" --json | node -e "let s='';process.stdin.on('data', d => s += d).on('end', () => process.stdout.write(JSON.parse(s)[0].filename))")"
          tarball="$RUNNER_TEMP/$filename"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
      - name: Install packed package in a scratch project
        env:
          TUDDOFS_TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          set -eu
          scratch="$(mktemp -d)"
          cd "$scratch"
          npm init --yes
          npm install "$TUDDOFS_TARBALL"
          node --input-type=module -e "const pkg = await import('tuddofs'); if (typeof pkg.createTuddoFs !== 'function') throw new Error('createTuddoFs export missing')"
